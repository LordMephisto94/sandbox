# Seconds since the latest accepted-motion counter increase.
HOLD_SECONDS=30
# Raw high-time count, not perceived brightness percent. Test before raising.
WHITE_HIGH_COUNT=6
# Ignore counter increments and light sensor changes caused by switching.
SETTLE_SECONDS=3
# Longer recovery after returning to IR (or switching ambient day/night).
IR_SETTLE_SECONDS=15
AMBIENT_DELAY_SECONDS=3
# GPIO15 read 1 throughout the user's night-mode dry run.
# Still verify the complementary daylight state before unattended use.
NIGHT_SENSOR_VALUE=1

# Boot service; stop it before changing this setting.
ENABLED=true
