name: motion-white

on:
  push:
    paths:
      - 'experiments/openipc-motion-white/**'
      - '.github/workflows/motion-white.yml'
  pull_request:
    paths:
      - 'experiments/openipc-motion-white/**'
      - '.github/workflows/motion-white.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential busybox python3
      - name: Test motion policy, recovery and PWM helper
        env:
          STRICT: '1'
        run: make -C experiments/openipc-motion-white check
